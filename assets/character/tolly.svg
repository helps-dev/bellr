<svg xmlns="http://www.w3.org/2000/svg" class="tolly" viewBox="-40 -40 1100 1100" data-session="closed" role="img" aria-label="Tolly, the bell unit">
<defs>
    <linearGradient id="h-tBody" x1="0.16" y1="0" x2="0.86" y2="1">
      <stop offset="0"    stop-color="#FFEC9A"/>
      <stop offset="0.34" stop-color="#FFC53D"/>
      <stop offset="0.74" stop-color="#EBA114"/>
      <stop offset="1"    stop-color="#AE7006"/>
    </linearGradient>
    <linearGradient id="h-tRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE68C"/>
      <stop offset="0.55" stop-color="#F0B222"/>
      <stop offset="1" stop-color="#B2700A"/>
    </linearGradient>
    <linearGradient id="h-tDark" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#F2B524"/>
      <stop offset="1" stop-color="#96600A"/>
    </linearGradient>
    <linearGradient id="h-tGlass" x1="0.28" y1="0" x2="0.72" y2="1">
      <stop offset="0" stop-color="#2E353E"/>
      <stop offset="0.5" stop-color="#151A20"/>
      <stop offset="1" stop-color="#080A0D"/>
    </linearGradient>
    <radialGradient id="h-tIrisShade" cx="0.62" cy="0.3" r="0.95">
      <stop offset="0"    stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.42" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1"    stop-color="#000000" stop-opacity="0.62"/>
    </radialGradient>
    <clipPath id="h-tEyeL"><circle cx="378" cy="416" r="100"/></clipPath>
    <clipPath id="h-tEyeR"><circle cx="622" cy="416" r="100"/></clipPath>
    <clipPath id="h-tClipBell">
      <path d="M500 150c142 0 232 106 250 296 11 120 53 210 92 266H158c39-56 81-146 92-266 18-190 108-296 250-296z"/>
    </clipPath>
    <linearGradient id="h-tThroat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#160A0D"/>
      <stop offset="0.45" stop-color="#2B1015"/>
      <stop offset="1"    stop-color="#43191F"/>
    </linearGradient>
    <linearGradient id="h-tTongue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9463F"/>
      <stop offset="1" stop-color="#EE7E75"/>
    </linearGradient>
    <clipPath id="h-tMouth"><path d="M420 548q80 30 160 0 16 82-80 100-96-18-80-100z"/></clipPath>
    <linearGradient id="h-tCape" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0"   stop-color="#0E8A4F"/>
      <stop offset="0.5" stop-color="#0A5C36"/>
      <stop offset="1"   stop-color="#063D22"/>
    </linearGradient>
    <linearGradient id="h-tGlove" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFFDF6"/>
      <stop offset="1" stop-color="#EDE4D0"/>
    </linearGradient>
    <linearGradient id="h-tWood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A86A2C"/>
      <stop offset="1" stop-color="#6E3F10"/>
    </linearGradient>
  </defs>

  <g stroke="#0B0B0D" stroke-width="14" stroke-linejoin="round" stroke-linecap="round">

    <ellipse cx="500" cy="916" rx="306" ry="32" fill="#0B0B0D" opacity="0.14" stroke="none"/>

    <g class="t-tilt">
    <g class="t-drift">
    <g class="t-swing">
    <g class="t-squash">

      <!-- the cape: session green, worn like a hero's. Drawn first so the
           body and arms always sit in front of it. The hem ends in points,
           the way a cape reads "moving" even in a still. -->
      <g class="t-cape">
        <path d="M340 370C214 382 104 478 68 626c-22 98-24 180 6 242l54-62 34 102 56-74 44 98c36-48 52-116 54-192 2-92-2-206 24-362z" fill="url(#h-tCape)"/>
        <path d="M660 370c126 12 236 108 272 256 22 98 24 180-6 242l-54-62-34 102-56-74-44 98c-36-48-52-116-54-192-2-92 2-206-24-362z" fill="url(#h-tCape)"/>
        <!-- inner folds, the bright lining catching light -->
        <path d="M290 460c-60 50-96 132-108 228M306 540c-44 60-68 138-74 214" fill="none" stroke="#00E06B" stroke-width="12" stroke-opacity="0.55"/>
        <path d="M710 460c60 50 96 132 108 228M694 540c44 60 68 138 74 214" fill="none" stroke="#00E06B" stroke-width="12" stroke-opacity="0.55"/>
      </g>

      <!-- crown loop -->
      <path d="M500 22a64 64 0 0 1 64 64v66h-42V86a22 22 0 0 0-44 0v66h-42V86a64 64 0 0 1 64-64z" fill="url(#h-tDark)"/>

      <!-- left arm, resting: white cartoon glove on a brass wrist -->
      <g class="t-arm-l">
        <path d="M262 546 L128 624" stroke="#0B0B0D" stroke-width="104" fill="none"/>
        <path d="M262 546 L128 624" stroke="url(#h-tDark)" stroke-width="74" fill="none"/>
        <circle cx="104" cy="646" r="74" fill="url(#h-tGlove)"/>
        <path d="M62 604q-8-30 16-40M94 590q-2-32 24-36M128 594q4-30 28-30" fill="none" stroke="#0B0B0D" stroke-width="10"/>
        <ellipse cx="42" cy="680" rx="27" ry="36" fill="url(#h-tGlove)" transform="rotate(-32 42 680)"/>
      </g>

      <!-- right arm raised, glove gripping the mallet: the bell that rings itself -->
      <g class="t-arm-r">
        <path d="M742 524 L872 342" stroke="#0B0B0D" stroke-width="104" fill="none"/>
        <path d="M742 524 L872 342" stroke="url(#h-tDark)" stroke-width="74" fill="none"/>
        <g class="t-striker">
          <path d="M878 292 L786 178" stroke="#0B0B0D" stroke-width="34" fill="none"/>
          <path d="M878 292 L786 178" stroke="url(#h-tWood)" stroke-width="20" fill="none"/>
          <circle cx="770" cy="160" r="58" fill="url(#h-tRim)"/>
          <circle cx="752" cy="140" r="17" fill="#FFF6DC" opacity="0.7" stroke="none"/>
        </g>
        <circle cx="890" cy="316" r="74" fill="url(#h-tGlove)"/>
        <path d="M852 272q-6-30 18-38M884 260q0-32 26-34M916 266q6-28 30-26" fill="none" stroke="#0B0B0D" stroke-width="10"/>
        <ellipse cx="950" cy="352" rx="27" ry="36" fill="url(#h-tGlove)" transform="rotate(28 950 352)"/>
      </g>

      <!-- grounding: a soft occlusion under the rim instead of a cavity -->
      <ellipse cx="500" cy="900" rx="316" ry="38" fill="#0B0B0D" opacity="0.2" stroke="none"/>

      <!-- bell body -->
      <path d="M500 150c142 0 232 106 250 296 11 120 53 210 92 266H158c39-56 81-146 92-266 18-190 108-296 250-296z" fill="url(#h-tBody)"/>
      <g clip-path="url(#h-tClipBell)">
        <ellipse cx="830" cy="470" rx="140" ry="380" fill="#96600A" opacity="0.42" stroke="none"/>
        <ellipse cx="322" cy="276" rx="98" ry="160" fill="#FFF8D6" opacity="0.62" stroke="none"/>
        <!-- narrow specular: what separates polished metal from flat yellow -->
        <ellipse cx="296" cy="304" rx="25" ry="148" fill="#FFFDF0" opacity="0.7" stroke="none" transform="rotate(-9 296 304)"/>
        <!-- bounce light climbing the shadow side -->
        <ellipse cx="798" cy="602" rx="54" ry="150" fill="#FFD98A" opacity="0.28" stroke="none"/>
        <!-- sound bow: real bells thicken and darken just above the rim -->
        <path d="M150 650h700v44H150z" fill="#8A5806" opacity="0.28"/>
        <!-- cast rings around the crown -->
        <path d="M288 210h424M274 242h452" stroke="#8A5806" stroke-opacity="0.4" stroke-width="9"/>
        <path d="M288 218h424M274 250h452" stroke="#FFF3C4" stroke-opacity="0.38" stroke-width="6"/>
      </g>

      <!-- flared lip, the mouth of the bell, and the clapper inside it -->
      <path d="M158 698c84 10 600 10 684 0 22 34 36 62 42 88-184 50-584 50-768 0 6-26 20-54 42-88z" fill="url(#h-tRim)"/>
      <ellipse cx="500" cy="800" rx="376" ry="50" fill="#241302"/>
      <ellipse cx="500" cy="792" rx="344" ry="39" fill="#120904"/>
      <g class="t-clapper">
        <path d="M500 706v92" stroke="#0B0B0D" stroke-width="32" fill="none"/>
        <path d="M500 706v92" stroke="url(#h-tDark)" stroke-width="18" fill="none"/>
        <circle cx="500" cy="838" r="58" fill="url(#h-tRim)"/>
        <circle cx="481" cy="817" r="16" fill="#FFF6DC" opacity="0.7" stroke="none"/>
      </g>
      <path d="M168 730c190 40 474 40 664 0" fill="none" stroke="#FFF6DC" stroke-width="10" opacity="0.5"/>

      <!-- face: white sclera, coloured iris carrying the session, glossy
           highlights over the pupil edge, brows above. The iris moves inside
           the eye when the cursor does, not the whole face. -->
      <g class="t-eyes">
          <g class="t-eye">
            <circle cx="378" cy="416" r="100" fill="#FBF8F1" stroke="none"/>
            <g clip-path="url(#h-tEyeL)">
              <circle cx="378" cy="416" r="100" fill="#C6D2D6" stroke="none"/>
              <circle cx="378" cy="429" r="100" fill="#FDFBF6" stroke="none"/>
              <g class="t-look">
                <circle class="t-iris" cx="378" cy="414" r="59" stroke="none"/>
                <circle cx="378" cy="414" r="59" fill="url(#h-tIrisShade)" stroke="none"/>
                <circle cx="378" cy="414" r="33" fill="#0A0A0C" stroke="none"/>
                <circle class="t-glint" cx="400" cy="391" r="24" stroke="none"/>
                <circle class="t-glint t-glint--sm" cx="385" cy="425" r="11" stroke="none"/>
              </g>
              <circle class="t-lid" cx="378" cy="278" r="116" fill="url(#h-tBody)" stroke="none"/>
            </g>
            <circle cx="378" cy="416" r="100" fill="none" stroke="#0B0B0D" stroke-width="16"/>
          </g>
          <g class="t-eye">
            <circle cx="622" cy="416" r="100" fill="#FBF8F1" stroke="none"/>
            <g clip-path="url(#h-tEyeR)">
              <circle cx="622" cy="416" r="100" fill="#C6D2D6" stroke="none"/>
              <circle cx="622" cy="429" r="100" fill="#FDFBF6" stroke="none"/>
              <g class="t-look">
                <circle class="t-iris" cx="622" cy="414" r="59" stroke="none"/>
                <circle cx="622" cy="414" r="59" fill="url(#h-tIrisShade)" stroke="none"/>
                <circle cx="622" cy="414" r="33" fill="#0A0A0C" stroke="none"/>
                <circle class="t-glint" cx="644" cy="391" r="24" stroke="none"/>
                <circle class="t-glint t-glint--sm" cx="629" cy="425" r="11" stroke="none"/>
              </g>
              <circle class="t-lid" cx="622" cy="278" r="116" fill="url(#h-tBody)" stroke="none"/>
            </g>
            <circle cx="622" cy="416" r="100" fill="none" stroke="#0B0B0D" stroke-width="16"/>
          </g>
      </g>

      <!-- brows -->
      <!-- Arched, not barred. The old brows were thick wedges angled down
           toward the nose, which reads as a frown however cheerful the
           mouth is. A thin arc with round caps lifts the whole face. -->
      <path class="t-brow" d="M296 300 Q378 238 462 284" fill="none" stroke="#0F1A1F" stroke-width="24" stroke-linecap="round"/>
      <path class="t-brow" d="M704 300 Q622 238 538 284" fill="none" stroke="#0F1A1F" stroke-width="24" stroke-linecap="round"/>

      <!-- mouth: a cavity, not a shape. Dark at the back, teeth hugging the
           top lip, tongue sitting at the front with a centre crease. -->
      <g class="t-mouth">
        <path d="M420 548q80 30 160 0 16 82-80 100-96-18-80-100z" fill="url(#h-tThroat)" stroke="#0B0B0D" stroke-width="13"/>
        <g clip-path="url(#h-tMouth)">
          <path d="M404 532q96 42 192 0v32q-96 30-192 0z" fill="#FDF7EC" stroke="none"/>
          <path d="M404 564q96 28 192 0" fill="none" stroke="#0B0B0D" stroke-opacity="0.28" stroke-width="7"/>
          <path d="M500 590q68 0 76 46 6 42-76 46-82-4-76-46 8-46 76-46z" fill="url(#h-tTongue)" stroke="none"/>
          <path d="M500 598v60" stroke="#A8322C" stroke-opacity="0.45" stroke-width="7" stroke-linecap="round"/>
          <ellipse cx="450" cy="612" rx="23" ry="10" fill="#FFFFFF" opacity="0.2" stroke="none" transform="rotate(-16 450 612)"/>
        </g>
      </g>

      <circle cx="316" cy="258" r="15" fill="#0B0B0D" opacity="0.24" stroke="none"/>
      <circle cx="684" cy="258" r="15" fill="#0B0B0D" opacity="0.24" stroke="none"/>
    </g>
    </g>
    </g>
    </g>
  </g>
      </svg>
